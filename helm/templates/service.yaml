apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
spec:
  type: {{ .Values.Service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.Service.port }}
      targetPort: {{ .Values.Service.targetPort }}
      nodePort: {{ .Values.Service.nodePort }}
